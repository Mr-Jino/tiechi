[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiechi"
version = "1.0.0"
description = "不锈钢板金定制品报价引擎：门套/窗套/装饰线条的七项成本拆解、展开几何与工艺告警"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mr-Jino" }]
keywords = ["quoting", "stainless-steel", "sheet-metal", "cost-estimation", "manufacturing", "报价", "门套"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Natural Language :: Chinese (Simplified)",
]

[project.urls]
Homepage = "https://github.com/Mr-Jino/tiechi"

[project.scripts]
tiechi = "tiechi.cli:main"

[tool.setuptools.packages.find]
include = ["tiechi*"]
